document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

16);border-color:var(--mint)}\n  .btn:active{background:rgba(15,181,160,.3)}\n  .btn[disabled]{opacity:.35;cursor:default}\n  .btn.on{background:var(--teal);border-color:var(--mint);color:#04211d}\n  .btn:focus-visible{outline:2px solid var(--mint);outline-offset:2px}\n  #stagetitle{padding:9px 20px;min-width:330px;text-align:center;pointer-events:auto}\n  #stagetitle .num{font-family:var(--fh);font-size:11px;letter-spacing:.3em;color:var(--mint)}\n  #stagetitle .ttl{font-family:var(--fh);font-size:19px;letter-spacing:.14em;text-transform:uppercase;line-height:1.15}\n  #dots{display:flex;gap:5px;justify-content:center;margin-top:6px}\n  #dots b{width:22px;height:2px;background:rgba(219,233,239,.2)}\n  #dots b.a{background:var(--mint)}\n  /* tools */\n  #tools{display:flex;gap:10px;pointer-events:auto}\n  /* side panel */\n  #panel{position:absolute;right:24px;top:22px;width:292px;padding:16px 18px 18px;pointer-events:auto;display:none}\n  #panel .k{color:var(--mint)}\n  #panel h2{font-family:var(--fh);font-weight:600;font-size:24px;letter-spacing:.1em;text-transform:uppercase;margin:6px 0 10px}\n  #panel p{font-size:13.5px;line-height:1.55;color:rgba(219,233,239,.82);margin:0 0 10px;text-wrap:pretty}\n  #panel ul{margin:0;padding-left:16px;font-size:12.5px;line-height:1.6;color:rgba(219,233,239,.7)}\n  #panel .close{position:absolute;right:10px;top:8px;background:none;border:0;color:rgba(219,233,239,.6);font-size:18px;cursor:pointer;font-family:var(--fh)}\n  #panel .close:hover{color:var(--mint)}\n  #verdict{margin-top:12px;border-top:1px solid var(--line-soft);padding-top:10px;font-size:12.5px;display:none}\n  #verdict b{color:#ff6b6b}\n  /* world labels */\n  .wl{position:absolute;transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap;\n    font-family:var(--fh);font-size:12px;letter-spacing:.13em;text-transform:uppercase;\n    padding:5px 9px;border:1px solid var(--line);background:rgba(5,10,20,.78);color:#cdfaf1;\n    opacity:0;transition:opacity .35s}\n  .wl .s{display:block;font-family:var(--fb);text-transform:none;letter-spacing:.02em;font-size:11px;color:rgba(219,233,239,.6)}\n  .wl.tag{color:var(--mint);border-color:rgba(45,224,196,.45)}\n  #hint{position:absolute;left:24px;top:196px;width:214px;padding:9px 12px;font-family:var(--fh);font-size:10.5px;\n    line-height:1.7;letter-spacing:.14em;text-transform:uppercase;color:rgba(219,233,239,.5);pointer-events:none}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div id=\"ui\">\n  <div id=\"brand\" class=\"bp\"><i class=\"tl\"><\u002Fi><i class=\"tr\"><\u002Fi><i class=\"bl\"><\u002Fi><i class=\"br\"><\u002Fi>\n    <h1>Caly<span>brix<\u002Fspan><\u002Fh1><p>Guided digital twin walkthrough<\u002Fp>\n  <\u002Fdiv>\n  <div id=\"legend\" class=\"bp\"><i class=\"tl\"><\u002Fi><i class=\"tr\"><\u002Fi><i class=\"bl\"><\u002Fi><i class=\"br\"><\u002Fi>\n    <div class=\"lg\"><span class=\"sw\"><\u002Fspan>Mechanical, sensed reality ↑<\u002Fdiv>\n    <div class=\"lg\"><span class=\"sw dash\"><\u002Fspan>Provenance, trust and trace ↓<\u002Fdiv>\n  <\u002Fdiv>\n  <div id=\"bottom\">\n  <div id=\"tools\">\n    <button class=\"btn\" id=\"replay\">↺ Replay the sensor docking<\u002Fbutton>\n    <button class=\"btn\" id=\"fault\">⚠ Inject fault<\u002Fbutton>\n  <\u002Fdiv>\n  <div id=\"stagebar\">\n    <button class=\"btn\" id=\"back\">◂ Back<\u002Fbutton>\n    <div id=\"stagetitle\" class=\"bp\"><i class=\"tl\"><\u002Fi><i class=\"tr\"><\u002Fi><i class=\"bl\"><\u002Fi><i class=\"br\"><\u002Fi>\n      <div class=\"num\"><span id=\"snum\">01 / 06<\u002Fspan><\u002Fdiv>\n      <div class=\"ttl\" id=\"sttl\">The sensor docks<\u002Fdiv>\n      <div id=\"dots\"><\u002Fdiv>\n    <\u002Fdiv>\n    <button class=\"btn\" id=\"next\">Next ▸<\u002Fbutton>\n  <\u002Fdiv>\n  <\u002Fdiv>\n  <div id=\"panel\" class=\"bp\"><i class=\"tl\"><\u002Fi><i class=\"tr\"><\u002Fi><i class=\"bl\"><\u002Fi><i class=\"br\"><\u002Fi>\n    <button class=\"close\" id=\"pclose\">×<\u002Fbutton>\n    <div class=\"kicker k\" id=\"pk\">Layer<\u002Fdiv>\n    <h2 id=\"pt\">Title<\u002Fh2>\n    <p id=\"pb\"><\u002Fp>\n    <ul id=\"pl\"><\u002Ful>\n    <div id=\"verdict\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div id=\"hint\" class=\"bp\"><i class=\"tl\"><\u002Fi><i class=\"tr\"><\u002Fi><i class=\"bl\"><\u002Fi><i class=\"br\"><\u002Fi>\n    Drag to orbit, scroll to zoom, hover an asset, click a layer\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script type=\"text/plain\" id=\"app-src\">\nimport * as THREE from 'three';\nimport { OrbitControls } from 'three/addons/controls/OrbitControls.js';\n\nconst TEAL = 0x0FB5A0, MINT = 0x2DE0C4, PAPER = 0xcdfaf1, RED = 0xff5b5b;\n\n/* ---------- renderer / scene ---------- */\nconst renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true });\nrenderer.setPixelRatio(Math.min(devicePixelRatio, 2));\nrenderer.setSize(innerWidth || 1280, innerHeight || 720, false);\nrenderer.domElement.style.width = '100%';\nrenderer.domElement.style.height = '100%';\nrenderer.toneMapping = THREE.ACESFilmicToneMapping;\nrenderer.toneMappingExposure = 1.05;\ndocument.body.appendChild(renderer.domElement);\n\nconst scene = new THREE.Scene();\nscene.background = new THREE.Color(0x050a14);\nscene.fog = new THREE.FogExp2(0x050a14, 0.011);\n\nconst camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 500);\ncamera.position.set(-19, 3.4, 8);\n\nconst controls = new OrbitControls(camera, renderer.domElement);\ncontrols.enableDamping = true; controls.dampingFactor = 0.07;\ncontrols.minDistance = 2; controls.maxDistance = 120;\ncontrols.maxPolarAngle = Math.PI * 0.495;\n\nscene.add(new THREE.HemisphereLight(0x2b5d7d, 0x05101c, 1.5));\nconst dir = new THREE.DirectionalLight(0xd8f2ff, 1.5); dir.position.set(-14, 18, 14); scene.add(dir);\nconst fill = new THREE.DirectionalLight(0x7fd8ff, 0.7); fill.position.set(16, 6, -12); scene.add(fill);\nconst p1 = new THREE.PointLight(MINT, 60, 40); p1.position.set(0, 8, 6); scene.add(p1);\nconst p2 = new THREE.PointLight(TEAL, 90, 60); p2.position.set(0, 14, -2); scene.add(p2);\n\n/* grid floor */\nconst grid = new THREE.GridHelper(200, 100, 0x11525c, 0x0b2a33);\ngrid.material.transparent = true; grid.material.opacity = 0.5; grid.material.depthWrite = false;\nscene.add(grid);\n\n/* ---------- shared materials ---------- */\nconst M = {\n  shell:  new THREE.MeshStandardMaterial({ name:'shell', color:0x2b4162, metalness:.55, roughness:.5 }),\n  shellD: new THREE.MeshStandardMaterial({ name:'shell_dark', color:0x1b2c46, metalness:.45, roughness:.65 }),\n  steel:  new THREE.MeshStandardMaterial({ name:'steel', color:0x627e9c, metalness:.8, roughness:.32 }),\n  glow:   new THREE.MeshStandardMaterial({ name:'glow', color:0x093a36, emissive:MINT, emissiveIntensity:1.1, metalness:.2, roughness:.4 }),\n  glowDim:new THREE.MeshStandardMaterial({ name:'glow_dim', color:0x0a2430, emissive:TEAL, emissiveIntensity:.28, metalness:.3, roughness:.5 }),\n};\nconst edgeMat = (o=0.5, c=MINT) => new THREE.LineBasicMaterial({ color:c, transparent:true, opacity:o });\nfunction withEdges(mesh, o=0.5, c=MINT){\n  const e = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry, 28), edgeMat(o, c));\n  mesh.add(e); return mesh;\n}\nfunction mesh(geo, mat, name, pos, rot){\n  const m = new THREE.Mesh(geo, mat); m.name = name;\n  if (pos) m.position.set(...pos); if (rot) m.rotation.set(...rot);\n  return m;\n}\n\n/* ---------- motor + hummingbird ---------- */\nconst MOTOR_N = 12, SPACING = 4.2;\nconst motorX = i => (i - (MOTOR_N-1)/2) * SPACING;\nconst motors = [];\n\nfunction buildMotor(i){\n  const g = new THREE.Group();\n  g.position.set(motorX(i), 0, 0);\n  g.userData = { type:'hummingbird', id:'CP-' + String(i+1).padStart(2,'0'), index:i,\n                 live: i % 5 !== 3 };\n\n  g.add(withEdges(mesh(new THREE.BoxGeometry(2.6,.18,1.8), M.shellD, 'base_plate', [0,.09,0]), .25));\n  [-.85,.85].forEach((x,k)=> g.add(mesh(new THREE.BoxGeometry(.34,.4,1.5), M.shellD, 'foot_'+k, [x,.3,0])));\n  const body = mesh(new THREE.CylinderGeometry(.7,.7,1.75,36), M.shell, 'housing', [0,1.05,0], [Math.PI/2,0,0]);\n  g.add(withEdges(body, .22));\n  for (let f=0; f<6; f++)\n    g.add(mesh(new THREE.CylinderGeometry(.74,.74,.045,32), M.steel, 'cooling_fin_'+f, [0,1.05,-.7+f*.28], [Math.PI/2,0,0]));\n  g.add(withEdges(mesh(new THREE.CylinderGeometry(.5,.5,.22,28), M.steel, 'drive_end', [0,1.05,.98], [Math.PI/2,0,0]), .3));\n  g.add(mesh(new THREE.CylinderGeometry(.13,.13,.6,20), M.steel, 'shaft', [0,1.05,1.32], [Math.PI/2,0,0]));\n  g.add(withEdges(mesh(new THREE.BoxGeometry(.62,.4,.66), M.shellD, 'terminal_box', [0,1.72,-.35]), .3));\n\n  /* three phase cables rising from the terminal box */\n  const cables = [];\n  [-.2,0,.2].forEach((x,k)=>{\n    const c = mesh(new THREE.CylinderGeometry(.055,.055,1.5,12), M.shellD, 'phase_cable_'+k, [x,2.55,-.42], [0,0,0]);\n    g.add(c); cables.push(c);\n  });\n\n  /* machine wing — the puck */\n  const puck = new THREE.Group(); puck.name = 'machine_sensor'; puck.position.set(0,1.82,.28);\n  puck.add(withEdges(mesh(new THREE.CylinderGeometry(.26,.28,.16,36), M.shell, 'puck_shell', [0,0,0]), .5));\n  puck.add(mesh(new THREE.TorusGeometry(.2,.014,8,40), M.glow, 'puck_ring', [0,.09,0], [Math.PI/2,0,0]));\n  for (let b=0;b<3;b++){\n    const a = b/3*Math.PI*2;\n    puck.add(mesh(new THREE.SphereGeometry(.028,10,8), M.steel, 'puck_bolt_'+b, [Math.cos(a)*.2,.085,Math.sin(a)*.2]));\n  }\n  const inner = new THREE.Group(); inner.name = 'triaxial_core'; inner.position.set(0,.12,0); inner.scale.setScalar(.001);\n  [[0,0,0],[0,0,Math.PI/2],[Math.PI/2,0,0]].forEach((r,k)=>\n    inner.add(mesh(new THREE.CylinderGeometry(.012,.012,.3,8), M.glow, 'accel_axis_'+k, [0,0,0], r)));\n  inner.add(mesh(new THREE.BoxGeometry(.07,.05,.07), M.glowDim, 'temp_probe', [.12,0,.1]));\n  puck.add(inner); puck.userData.inner = inner;\n  g.add(puck); g.userData.puck = puck;\n\n  /* electrical wing — three split-core CTs */\n  const cts = [];\n  cables.forEach((c,k)=>{\n    const ct = new THREE.Group(); ct.name = 'split_core_ct_'+k;\n    ct.position.set(c.position.x, 2.28 + k*.26, c.position.z);\n    const half = (sign) => {\n      const piv = new THREE.Group();\n      const h = mesh(new THREE.TorusGeometry(.115,.038,10,26,Math.PI), M.shell, 'ct_half', [0,0,0], [Math.PI/2, 0, sign>0?0:Math.PI]);\n      withEdges(h, .45); piv.add(h); return piv;\n    };\n    const a = half(1), b = half(-1);\n    ct.add(a, b); ct.userData = { a, b };\n    g.add(ct); cts.push(ct);\n  });\n  g.userData.cts = cts;\n\n  /* process wing — line tap */\n  const pipe = mesh(new THREE.CylinderGeometry(.17,.17,3.6,20), M.shellD, 'process_line', [0,.62,-1.25], [0,0,Math.PI/2]);\n  g.add(withEdges(pipe, .2));\n  const tap = new THREE.Group(); tap.name = 'process_sensor'; tap.position.set(-.55,.62,-1.25);\n  const stem = mesh(new THREE.CylinderGeometry(.055,.055,.62,14), M.steel, 'tap_stem', [0,.31,0]);\n  tap.add(stem);\n  tap.add(mesh(new THREE.BoxGeometry(.2,.16,.2), M.shell, 'tap_head', [0,.68,0]));\n  tap.add(mesh(new THREE.TorusGeometry(.11,.012,8,28), M.glow, 'tap_ring', [0,.68,0], [Math.PI/2,0,0]));\n  g.add(tap); g.userData.tap = tap;\n\n  /* wing status rings on the plate */\n  g.userData.wingRings = [puck.getObjectByName('puck_ring'), null, tap.getObjectByName('tap_ring')];\n\n  /* pick proxy */\n  const pick = mesh(new THREE.BoxGeometry(3.2,3.4,3.6), new THREE.MeshBasicMaterial({visible:false}), 'pick', [0,1.6,-.3]);\n  pick.userData.owner = g; g.add(pick);\n\n  scene.add(g); motors.push(g);\n  return g;\n}\nfor (let i=0;i<MOTOR_N;i++) buildMotor(i);\nconst cp01 = motors[0];\n\n/* ---------- calibrators ---------- */\nconst calibrators = [];\nconst CAL_Y = 6.9;\n[[0,3],[4,7],[8,11]].forEach((range, c) => {\n  const cx = (motorX(range[0]) + motorX(range[1])) / 2;\n  const g = new THREE.Group(); g.position.set(cx, CAL_Y, -1.2);\n  g.userData = { type:'calibrator', id:'CAL-' + (c+1), range };\n  const plate = mesh(new THREE.BoxGeometry(7.6,.12,3.4), new THREE.MeshStandardMaterial({\n    color:0x0a1626, metalness:.4, roughness:.6, transparent:true, opacity:.45 }), 'platform');\n  g.add(withEdges(plate, .5));\n  const core = mesh(new THREE.OctahedronGeometry(.62,0), M.glow, 'calibrator_core', [0,.85,0]);\n  g.add(withEdges(core, .8)); g.userData.core = core;\n  const ring = mesh(new THREE.TorusGeometry(1.25,.02,8,64), M.glow, 'tuning_ring', [0,.85,0], [Math.PI/2,0,0]);\n  g.add(ring); g.userData.ring = ring;\n  // hummingbird tokens gathered on the platform\n  g.userData.tokens = [];\n  for (let k=0;k<=range[1]-range[0];k++){\n    const t = mesh(new THREE.CylinderGeometry(.2,.22,.12,24), M.glowDim, 'gathered_hummingbird_'+k,\n      [-2.4 + k*1.6, .18, .9]);\n    withEdges(t,.5); g.add(t); g.userData.tokens.push(t);\n  }\n  const pick = mesh(new THREE.BoxGeometry(7.8,2.2,3.6), new THREE.MeshBasicMaterial({visible:false}), 'pick', [0,.8,0]);\n  pick.userData.owner = g; g.add(pick);\n  scene.add(g); calibrators.push(g);\n});\n\n/* ---------- flock ---------- */\nconst flock = new THREE.Group(); flock.position.set(0, 14.4, -2);\nflock.userData = { type:'flock', id:'FLOCK' };\nconst flockCore = mesh(new THREE.IcosahedronGeometry(1.35,1), new THREE.MeshStandardMaterial({\n  name:'flock_core', color:0x07302e, emissive:MINT, emissiveIntensity:1.4, metalness:.3, roughness:.35 }), 'flock_core');\nwithEdges(flockCore,.9); flockCore.scale.setScalar(.42); flock.add(flockCore);\nconst flockRings = [];\n[[0,0,0],[Math.PI/2.4,.5,0],[ -Math.PI/3,-.7,.4]].forEach((r,k)=>{\n  const ring = mesh(new THREE.TorusGeometry(2.2 + k*.55, .018, 8, 96), M.glow, 'flock_ring_'+k, [0,0,0], r);\n  flock.add(ring); flockRings.push(ring);\n});\nconst flockPick = mesh(new THREE.SphereGeometry(2.6,16,12), new THREE.MeshBasicMaterial({visible:false}), 'pick');\nflockPick.userData.owner = flock; flock.add(flockPick);\nscene.add(flock);\n\n/* ---------- swarm ---------- */\nconst swarm = new THREE.Group(); swarm.position.set(12.5, 15.4, -4);\nswarm.userData = { type:'swarm', id:'SWARM' };\nconst swarmGeo = new THREE.IcosahedronGeometry(2.3, 1);\nswarm.add(new THREE.LineSegments(new THREE.WireframeGeometry(swarmGeo),\n  new THREE.LineBasicMaterial({ color:MINT, transparent:true, opacity:.12 })));\nconst nodePos = [];\n{\n  const pos = swarmGeo.attributes.position, seen = new Set();\n  for (let i=0;i<pos.count;i++){\n    const v = new THREE.Vector3().fromBufferAttribute(pos,i);\n    const key = v.toArray().map(n=>n.toFixed(2)).join(',');\n    if (seen.has(key)) continue; seen.add(key); nodePos.push(v);\n  }\n}\nconst swarmNodesGeo = new THREE.BufferGeometry().setFromPoints(nodePos);\nconst swarmNodes = new THREE.Points(swarmNodesGeo, new THREE.PointsMaterial({\n  color:PAPER, size:.1, transparent:true, opacity:.55, blending:THREE.AdditiveBlending, depthWrite:false }));\nswarmNodes.name = 'voting_nodes'; swarm.add(swarmNodes);\nconst swarmPick = mesh(new THREE.SphereGeometry(2.5,16,12), new THREE.MeshBasicMaterial({visible:false}), 'pick');\nswarmPick.userData.owner = swarm; swarm.add(swarmPick);\nscene.add(swarm);\n\n\n/* ---------- hummingbirds ---------- */\nconst AXIS_Z = new THREE.Vector3(0,0,1);\nconst birdMat = new THREE.MeshStandardMaterial({ name:'hummingbird_body', color:0x063f3a,\n  emissive:MINT, emissiveIntensity:1.0, metalness:.35, roughness:.32 });\nconst wingMat = new THREE.MeshBasicMaterial({ name:'hummingbird_wing', color:MINT, transparent:true,\n  opacity:.38, side:THREE.DoubleSide, blending:THREE.AdditiveBlending, depthWrite:false });\nconst tailMat = new THREE.MeshBasicMaterial({ name:'hummingbird_tail', color:PAPER, transparent:true,\n  opacity:.3, side:THREE.DoubleSide, blending:THREE.AdditiveBlending, depthWrite:false });\n\nconst BODY_GEO = (() => {\n  const prof = [[0,-.62],[.05,-.5],[.11,-.3],[.16,-.08],[.155,.12],[.115,.28],[.075,.36],\n                [.03,.42],[.015,.62],[.007,.9],[0,1.0]];\n  const g = new THREE.LatheGeometry(prof.map(p => new THREE.Vector2(p[0], p[1])), 18);\n  g.rotateX(Math.PI/2); g.scale(1,1,.9);\n  return g;\n})();\nconst WING_GEO = (() => {\n  const s = new THREE.Shape();\n  s.moveTo(0,0);\n  s.bezierCurveTo(.4,.3, 1.05,.34, 1.42,.05);\n  s.bezierCurveTo(1.0,-.14, .42,-.18, 0,0);\n  const g = new THREE.ShapeGeometry(s, 14);\n  g.rotateX(-Math.PI/2);\n  return g;\n})();\nconst TAIL_GEO = (() => {\n  const s = new THREE.Shape();\n  s.moveTo(0,0); s.lineTo(.34,-.5); s.lineTo(0,-.34); s.lineTo(-.34,-.5); s.lineTo(0,0);\n  const g = new THREE.ShapeGeometry(s);\n  g.rotateX(-Math.PI/2);\n  return g;\n})();\nconst WING_L = new THREE.Vector3(-.085,.1,.1), WING_R = new THREE.Vector3(.085,.1,.1);\nconst SC_L = new THREE.Vector3(-1,1,1), SC_R = new THREE.Vector3(1,1,1);\n\nfunction makeBird(scale){\n  const g = new THREE.Group(); g.name = 'hummingbird';\n  const body = new THREE.Mesh(BODY_GEO, birdMat); body.name = 'bird_body';\n  body.add(new THREE.LineSegments(new THREE.EdgesGeometry(BODY_GEO, 30), edgeMat(.4)));\n  g.add(body);\n  const tail = new THREE.Mesh(TAIL_GEO, tailMat); tail.name = 'bird_tail'; tail.position.set(0,.02,-.6);\n  g.add(tail);\n  const wl = new THREE.Group(), wr = new THREE.Group();\n  wl.position.copy(WING_L); wr.position.copy(WING_R);\n  const ml = new THREE.Mesh(WING_GEO, wingMat); ml.name = 'wing_left'; ml.scale.x = -1;\n  const mr = new THREE.Mesh(WING_GEO, wingMat); mr.name = 'wing_right';\n  wl.add(ml); wr.add(mr); g.add(wl, wr);\n  g.userData = { wl, wr, flap: Math.random()*6 };\n  g.scale.setScalar(scale);\n  return g;\n}\nfunction flap(bird, time, freq){\n  const a = Math.sin(time*freq + bird.userData.flap)*1.05;\n  bird.userData.wl.rotation.z = -a; bird.userData.wr.rotation.z = a;\n}\n\n/* the scout that hovers over CP-01 while its sensors dock */\nconst scout = makeBird(.4);\nscene.add(scout);\n\n/* every calibrator is an adult hummingbird */\ncalibrators.forEach(c => {\n  c.userData.core.visible = false;\n  const b = makeBird(1.05); b.position.set(0,1.6,.2); c.add(b); c.userData.bird = b;\n});\n\n/* instanced flocks */\nfunction instancedFlock(count){\n  const group = new THREE.Group();\n  const bodies = new THREE.InstancedMesh(BODY_GEO, birdMat, count);\n  const wl = new THREE.InstancedMesh(WING_GEO, wingMat, count);\n  const wr = new THREE.InstancedMesh(WING_GEO, wingMat, count);\n  [bodies, wl, wr].forEach(m => { m.frustumCulled = false;\n    m.instanceMatrix.setUsage(THREE.DynamicDrawUsage); group.add(m); });\n  const birds = Array.from({length:count}, () => ({ ph: Math.random()*6.28, sp: Math.random()*6.28 }));\n  return { group, bodies, wl, wr, birds };\n}\nconst _d = new THREE.Object3D(), _q = new THREE.Quaternion(), _m = new THREE.Matrix4(),\n      _lm = new THREE.Matrix4(), _p = new THREE.Vector3(), _look = new THREE.Vector3();\nfunction updateFlock(fl, time, scale, posFn){\n  fl.birds.forEach((b,i) => {\n    posFn(b, i, time, _p, _look);\n    _d.position.copy(_p); _d.scale.setScalar(scale);\n    _d.lookAt(_look); _d.updateMatrix();\n    fl.bodies.setMatrixAt(i, _d.matrix);\n    const a = Math.sin(time*22 + b.ph)*1.05;\n    _q.setFromAxisAngle(AXIS_Z, -a);\n    _lm.compose(WING_L, _q, SC_L);\n    fl.wl.setMatrixAt(i, _m.multiplyMatrices(_d.matrix, _lm));\n    _q.setFromAxisAngle(AXIS_Z, a);\n    _lm.compose(WING_R, _q, SC_R);\n    fl.wr.setMatrixAt(i, _m.multiplyMatrices(_d.matrix, _lm));\n  });\n  fl.bodies.instanceMatrix.needsUpdate = true;\n  fl.wl.instanceMatrix.needsUpdate = true;\n  fl.wr.instanceMatrix.needsUpdate = true;\n}\n\n/* the Flock: a brain drawn by sixty four hovering hummingbirds */\nconst brain = instancedFlock(88);\nflock.add(brain.group);\nbrain.birds.forEach((b,i) => {\n  const side = i % 2 ? 1 : -1;\n  const u = Math.acos(1 - 2*((i + .5)/brain.birds.length));\n  const v = i * 2.399963;\n  const p = new THREE.Vector3(Math.sin(u)*Math.cos(v), Math.cos(u), Math.sin(u)*Math.sin(v));\n  p.multiply(new THREE.Vector3(1.9, 1.6, 2.0));\n  p.x = p.x*.6 + side*1.05;\n  p.y += Math.sin(p.z*2.4)*.16;\n  p.z += Math.sin(p.y*3.1)*.12;\n  b.home = p; b.orb = .12 + Math.random()*.1; b.rate = .5 + Math.random()*.7;\n  b.tan = new THREE.Vector3().crossVectors(p, new THREE.Vector3(0,1,0)).normalize();\n});\nconst brainPos = (b, i, time, out, look) => {\n  const w = time*b.rate + b.ph;\n  out.copy(b.home);\n  out.x += Math.cos(w)*b.orb; out.y += Math.sin(w*1.3)*b.orb; out.z += Math.sin(w)*b.orb;\n  look.copy(out).addScaledVector(b.tan, 1);\n};\n\n/* the Swarm: a murmuration of two hundred hummingbirds on inclined orbits */\nconst murm = instancedFlock(200);\nswarm.add(murm.group);\nmurm.birds.forEach(b => {\n  b.rad = 1.7 + Math.random()*1.9;\n  b.rate = .35 + Math.random()*.5;\n  b.axis = new THREE.Quaternion().setFromEuler(new THREE.Euler(\n    Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI));\n});\nconst _c1 = new THREE.Vector3(), _c2 = new THREE.Vector3();\nconst murmPos = (b, i, time, out, look) => {\n  const w = time*b.rate + b.sp;\n  const r = b.rad * (1 + Math.sin(time*.6 + b.ph)*.07);\n  _c1.set(Math.cos(w)*r, Math.sin(w)*r, Math.sin(w*2 + b.ph)*.35).applyQuaternion(b.axis);\n  _c2.set(Math.cos(w+.09)*r, Math.sin(w+.09)*r, Math.sin((w+.09)*2 + b.ph)*.35).applyQuaternion(b.axis);\n  out.copy(_c1); look.copy(_c2);\n};\n\n/* ---------- streams ---------- */\nconst OFF = 0.42; // lateral separation between the two streams\nconst links = [];  // {curve, kind, assetIndex, tier, line}\nfunction addLink(a, b, kind, assetIndex, tier, bow=1){\n  const off = kind === 'prov' ? OFF : -OFF*0.35;\n  const A = a.clone(), B = b.clone();\n  A.x += off; B.x += off;\n  const mid1 = A.clone().lerp(B,.34); mid1.z += bow*1.1; mid1.x += off*.6;\n  const mid2 = A.clone().lerp(B,.7);  mid2.z += bow*.5;\n  const curve = new THREE.CatmullRomCurve3([A, mid1, mid2, B]);\n  const pts = curve.getPoints(80);\n  const geo = new THREE.BufferGeometry().setFromPoints(pts);\n  let line;\n  if (kind === 'mech'){\n    line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color:MINT, transparent:true, opacity:.5,\n      blending:THREE.AdditiveBlending, depthWrite:false }));\n  } else {\n    line = new THREE.Line(geo, new THREE.LineDashedMaterial({ color:PAPER, dashSize:.34, gapSize:.28,\n      transparent:true, opacity:.42, blending:THREE.AdditiveBlending, depthWrite:false }));\n    line.computeLineDistances();\n  }\n  line.name = kind + '_link';\n  scene.add(line);\n  const rec = { curve, kind, assetIndex, tier, line, base:line.material.opacity };\n  links.push(rec); return rec;\n}\nmotors.forEach((m,i) => {\n  const cal = calibrators[Math.floor(i/4)];\n  const from = new THREE.Vector3(m.position.x, 2.0, .28);\n  const to   = new THREE.Vector3(cal.position.x + (i%4-1.5)*1.5, CAL_Y - .1, cal.position.z + .9);\n  addLink(from, to, 'mech', i, 'm2c', 1);\n  addLink(to, from, 'prov', i, 'm2c', 1);\n});\ncalibrators.forEach((c, ci) => {\n  const from = new THREE.Vector3(c.position.x, CAL_Y + 1.5, c.position.z);\n  const to = flock.position.clone().add(new THREE.Vector3(0,-.4,0));\n  addLink(from, to, 'mech', ci, 'c2f', .6);\n  addLink(to, from, 'prov', ci, 'c2f', .6);\n});\naddLink(flock.position.clone().add(new THREE.Vector3(1.4,.2,0)), swarm.position.clone().add(new THREE.Vector3(-1.6,0,0)), 'mech', 0, 'f2s', .3);\naddLink(swarm.position.clone().add(new THREE.Vector3(-1.6,-.5,.4)), flock.position.clone().add(new THREE.Vector3(1.4,-.4,.4)), 'prov', 0, 'f2s', .3);\n\n/* particles along links */\nfunction particleSystem(color, size, count, filter){\n  const set = links.filter(filter);\n  const parts = [];\n  for (let i=0;i<count;i++){\n    const l = set[i % set.length];\n    parts.push({ l, t: Math.random(), sp: .1 + Math.random()*.08 });\n  }\n  const geo = new THREE.BufferGeometry();\n  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(parts.length*3), 3));\n  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ color, size, transparent:true,\n    opacity:.95, blending:THREE.AdditiveBlending, depthWrite:false }));\n  scene.add(pts);\n  return { pt ;\nconst ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;\nconst smooth = (a,b,t) => a + (b-a)*Math.min(1, t);\n\n/* stage-1 assembly timeline (seconds) */\nconst T = { puck:[0.3,1.9], reveal:[1.9,2.7], fft:[2.7,4.2], ct:[4.2,6.0], tap:[6.0,7.0], glow:[7.0,8.2] };\nconst seg = (t, [a,b]) => Math.max(0, Math.min(1, (t-a)/(b-a)));\n\nfunction applyAssembly(p){ // p: named progress object\n  const m = cp01;\n  const puck = m.userData.puck;\n  puck.position.y = 1.82 + (1-p.puck)*1.5;\n  puck.rotation.y = (1-p.puck)*Math.PI*3;\n  puck.userData.inner.scale.setScalar(Math.max(.001, p.reveal));\n  fftPanel.material.opacity = p.fft > 0 ? Math.min(1, p.fft*3) * (0.35 + 0.65*Math.min(1,p.fft*1.4)) : 0;\n  m.userData.cts.forEach((ct,k) => {\n    const sub = Math.max(0, Math.min(1, p.ct*3 - k));\n    const open = (1-sub);\n    ct.userData.a.position.x = open*.22; ct.userData.a.rotation.z = open*.5;\n    ct.userData.b.position.x = -open*.22; ct.userData.b.rotation.z = -open*.5;\n    ct.children.forEach(c => c.children[0] && (c.children[0].visible = true));\n  });\n  const tap = m.userData.tap;\n  tap.scale.y = Math.max(.02, p.tap); tap.visible = p.tap > 0.02;\n  return p;\n}\n\nfunction resizeIfNeeded(){\n  const w = renderer.domElement.clientWidth || innerWidth;\n  const h = renderer.domElement.clientHeight || innerHeight;\n  if (!w || !h) return false;\n  const pr = Math.min(devicePixelRatio, 2);\n  if (renderer.domElement.width !== Math.floor(w*pr) || renderer.domElement.height !== Math.floor(h*pr)){\n    renderer.setPixelRatio(pr);\n    renderer.setSize(w, h, false);\n    camera.aspect = w/h; camera.updateProjectionMatrix();\n  }\n  return true;\n}\n\nfunction render(){\n  const dt = Math.min(.05, clock.getDelta()), time = clock.elapsedTime;\n  if (!resizeIfNeeded()){ requestAnimationFrame(render); return; }\n\n  /* camera fly */\n  if (fly){\n    fly.t += dt / fly.dur;\n    const k = ease(Math.min(1, fly.t));\n    camera.position.lerpVectors(fly.p0, fly.p1, k);\n    cont line.visible = l.line.material.opacity > 0.01;\n    if (l.kind === 'prov') l.line.material.dashOffset = -time * .9;\n  });\n  motors.forEach((m,i) => {\n    const dim = focus !== null && focus !== i;\n    m.traverse(o => { if (o.material && o.material.opacity !== undefined && o.isLineSegments)\n      o.material.opacity = smooth(o.material.opacity, dim ? .08 : .45, dt*6); });\n  });\n\n  /* particles */\n  const flowScale = stage >= 2 ? 1 : 0;\n  [mechP, provP].forEach(sysm => {\n    const arr = sysm.geo.attributes.position.array;\n    sysm.parts.forEach((pt,i) => {\n      const vis = pt.l.line.visible && pt.l.line.material.opacity > .05;\n      pt.t += dt * pt.sp * flowScale;\n      if (pt.t > 1) pt.t -= 1;\n      if (vis) { pt.l.curve.getPointAt(pt.t, tmp); }\n      else tmp.set(0,-999,0);\n      arr[i*3] = tmp.x; arr[i*3+1] = tmp.y; arr[i*3+2] = tmp.z;\n    });\n    sysm.geo.attributes.position.needsUpdate = true;\n    sysm.pts.material.opacity = smooth(sysm.pts.material.opacity, flowScale ? .95 : 0, dt*4);\n  });\n\n  /* fault */\n  faultP.pts.material.opacity = smooth(faultP.pts.material.opacity, fault.on ? 1 : 0, dt*3);\n  if ((fault.on && fault.chain.length) || faultP.pts.material.opacity > .01){\n    fault.t += dt * .28;\n    const arr = faultP.geo.attributes.position.array;\n    const chain = fault.chain.filter(l => l.line.visible);\n    faultP.parts.forEach((pt,i) => {\n      let t = (fault.t + i*.012) % (chain.length || 1);\n      const li = Math.floor(t); const l = chain[li];\n      if (!l) { tmp.set(0,-999,0); }\n      else l.curve.getPointAt(Math.max(0,Math.min(1, t - li)), tmp);\n      arr[i*3]=tmp.x; arr[i*3+1]=tmp.y; arr[i*3+2]=tmp.z;\n    });\n    faultP.geo.attributes.position.needsUpdate = true;\n  }\n\n  /* living motion */\n  calibrators.forEach((c,i) => {\n    c.userData.core.rotation.y += dt*.7; c.userData.core.rotation.x += dt*.25;\n    const pulse = 1 + Math.sin(time*2.2 + i)*0.06;\n    c.userData.ring.scale.setScalar(pulse);\n    c.userData.ring.rotation.z += dt*.4;\n    c.userData.tokens.forEach((t,k) => t.position.y = .18 + Math.sin(time*2.6 + k*.9 + i)*.05);\n  });\n  scout.visible = stage <= 2;\n  if (scout.visible){\n    const w = time*.75;\n    scout.position.set(cp01.position.x + Math.cos(w)*1.15, 2.65 + Math.sin(time*1.7)*.2, .55 + Math.sin(w)*1.0);\n    scout.lookAt(cp01.position.x + Math.cos(w+.5)*1.15, 2.6, .55 + Math.sin(w+.5)*1.0);\n    flap(scout, time, 26);\n  }\n  calibrators.forEach((c,i) => {\n    if (!c.visible) return;\n    const b = c.userData.bird;\n    b.position.y = 1.55 + Math.sin(time*1.4 + i)*.16;\n    b.rotation.y = Math.sin(time*.45 + i)*.5;\n    flap(b, time, 22);\n  });\n  if (flock.visible) updateFlock(brain, time, .62, brainPos);\n  if (swarm.visible) updateFlock(murm, time, .42, murmPos);\n  flockCore.rotation.y += dt*.25; flockCore.rotation.x += dt*.1;\n  flockRings.forEach((r,k)=> { r.rotation.z += dt*(.18 + k*.07); r.rotation.x += dt*.04; });\n  flockCore.material.emissive.setHex(fault.on ? 0xff5b5b : MINT);\n  flockCore.material.emissiveIntensity = 1.2 + Math.sin(time*(fault.on?7:2.4))*(fault.on?.7:.3);\n  swarm.rotation.y += dt*.2; swarm.rotation.x = Math.sin(time*.25)*.15;\n  swarmNodes.material.size = .16 + Math.sin(time*4)*.03;\n\n  /* labels */\n  labelDefs.forEach((d,i) => {\n    const el = labelEls[i];\n    const on = d.st.includes(stage);\n    el.style.opacity = on ? 1 : 0;\n    if (!on) return;\n    const v = d.pos().project(camera);\n    if (v.z > 1) { el.style.opacity = 0; return; }\n    let sx = (v.x*.5+.5)*innerWidth, sy = (-v.y*.5+.5)*innerHeight;\n    const w = el.offsetWidth/2 + 8, hh = el.offsetHeight/2 + 6;\n    /* nudge the later label off any already-placed one, never hide it */\n    for (let pass = 0; pass < 4; pass++){\n      let moved = false;\n      for (let j = 0; j < i; j++){\n        const o = labelEls[j];\n        if (o.style.opacity === '0' || !o.style.left) continue;\n        const ox = parseFloat(o.style.left), oy = parseFloat(o.style.top);\n        const minY = (o.offsetHeight + el.offsetHeight)/2 + 8;\n        if (Math.abs(ox - sx) < (o.offsetWidth + el.offsetWidth)/2 + 10 && Math.abs(oy - sy) < minY){\n          sy = sy > oy ? oy + minY : oy - minY; moved = true;\n        }\n      }\n      if (!moved) break;\n    }\n    sx = Math.max(300 + w, sx);\n    sx = Math.min(sx, innerWidth - (panelOpen ? 336 : 24) - w);\n    sy = Math.max(28 + hh, Math.min(sy, innerHeight - 146 - hh));\n    el.style.left = sx + 'px';\n    el.style.top = sy + 'px';\n    el.style.opacity = 1;\n  });\n  statusEls.forEach((el,i) => {\n    const on = stage >= 3 && (stage === 3 || stage >= 5 ? stage === 3 : true) && motors[i].visible;\n    if (!on || (stage !== 3 && !STAGES[stage-1].free)){ el.style.opacity = 0; return; }\n    const v = motors[i].position.clone().add(new THREE.Vector3(0,3.9,0)).project(camera);\n    if (v.z > 1){ el.style.opacity = 0; return; }\n    const sx = (v.x*.5+.5)*innerWidth, sy = (-v.y*.5+.5)*innerHeight;\n    const clear = sx > 320 && sx < innerWidth - (panelOpen ? 340 : 40) && sy > 40 && sy < innerHeight - 150;\n    el.style.opacity = clear ? ((focus === null || focus === i) ? 1 : .18) : 0;\n    el.style.left = sx + 'px';\n    el.style.top = sy + 'px';\n  });\n\n  renderer.render(scene, camera);\n  requestAnimationFrame(render);\n}\nsetStage(1, false);\nrender();\n\naddEventListener('resize', resizeIfNeeded);\nnew ResizeObserver(resizeIfNeeded).observe(document.documentElement);\n<\u002Fscript>\n<script>\n(async () => {\n  const R = window.__resources || {};\n  const CDN = {\n    threeModule: 'https://unpkg.com/three@0.184.0/build/three.module.js',\n    threeCore: 'https://unpkg.com/three@0.184.0/build/three.core.js',\n    orbitControls: 'https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js',\n  };\n  const text = async k => (await fetch(R[k] || CDN[k])).text();\n  const blobUrl = t => URL.createObjectURL(new Blob([t], { type:'text/javascript' }));\n  const coreUrl = blobUrl(aw
